name: Check and publish prototype
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: time-slip-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Publish standalone prototype
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git add prototype/index.html
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: publish verified standalone prototype [skip ci]"
            git push
          fi
      - name: Verify public prototype
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          const sha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const url = `https://rawcdn.githack.com/W-X-Z/Time-slip/${sha}/prototype/index.html`;
          const expected = await readFile('prototype/index.html');
          let failure;
          for (let attempt = 0; attempt < 3; attempt++) {
            try {
              const response = await fetch(url, { signal: AbortSignal.timeout(25000) });
              const content = Buffer.from(await response.arrayBuffer());
              if (!response.ok) throw new Error(`HTTP ${response.status}`);
              if (!response.headers.get('content-type')?.includes('text/html')) throw new Error('Not served as HTML');
              if (!content.equals(expected)) throw new Error('Public HTML differs from the tested build');
              console.log(`PUBLIC_PROTOTYPE_URL=${url}`);
              console.log(`HTTP=${response.status}; CONTENT_TYPE=${response.headers.get('content-type')}; BYTES=${content.length}; SHA256=${createHash('sha256').update(content).digest('hex')}`);
              failure = null; break;
            } catch (error) { failure = error; await new Promise(resolve => setTimeout(resolve, 2000)); }
          }
          if (failure) throw failure;
          NODE
